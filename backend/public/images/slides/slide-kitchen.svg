<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" width="600" height="440" fill="none">
  <defs>
    <linearGradient id="bgKitchen" x1="0" y1="0" x2="600" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#9A3412"/>
      <stop offset="50%" stop-color="#0F2A43"/>
      <stop offset="100%" stop-color="#081A2B"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
  </defs>

  <rect width="600" height="440" rx="32" fill="url(#bgKitchen)"/>
  <circle cx="480" cy="100" r="130" fill="#FF6B35" fill-opacity="0.18"/>
  <circle cx="120" cy="340" r="140" fill="#12B5A5" fill-opacity="0.14"/>

  <ellipse cx="300" cy="396" rx="180" ry="15" fill="#04101C" fill-opacity="0.45"/>

  <!-- Oven / Range Showcase -->
  <rect x="145" y="88" width="195" height="292" rx="20" fill="url(#cardGrad)" stroke="#CBD5E1" stroke-width="2"/>
  <rect x="145" y="88" width="195" height="48" rx="18" fill="#1E293B"/>
  <circle cx="175" cy="112" r="7" fill="#94A3B8"/>
  <circle cx="198" cy="112" r="7" fill="#94A3B8"/>
  <rect x="224" y="103" width="48" height="18" rx="4" fill="#0F172A"/>
  <text x="248" y="116" font-family="monospace" font-size="11" fill="#FF6B35" text-anchor="middle">200°C</text>
  <circle cx="292" cy="112" r="7" fill="#94A3B8"/>
  <circle cx="315" cy="112" r="7" fill="#94A3B8"/>

  <!-- Oven Window -->
  <rect x="167" y="156" width="151" height="162" rx="14" fill="#0F172A" stroke="#64748B" stroke-width="3"/>
  <rect x="182" y="176" width="121" height="118" rx="10" fill="#EA580C" fill-opacity="0.22"/>
  <line x1="182" y1="238" x2="303" y2="238" stroke="#F97316" stroke-width="2" stroke-dasharray="6 4"/>
  <rect x="180" y="142" width="125" height="6" rx="3" fill="#94A3B8"/>

  <!-- Espresso / Small Appliance Showcase -->
  <rect x="358" y="168" width="126" height="212" rx="18" fill="url(#cardGrad)" stroke="#CBD5E1" stroke-width="2"/>
  <rect x="374" y="186" width="94" height="36" rx="10" fill="#0F2A43"/>
  <circle cx="421" cy="204" r="10" fill="#12B5A5"/>
  <rect x="386" y="236" width="70" height="90" rx="8" fill="#1E293B"/>
  <rect x="401" y="274" width="40" height="44" rx="6" fill="#F8FAFC"/>
  <rect x="374" y="338" width="94" height="18" rx="6" fill="#94A3B8"/>

  <!-- Fast Delivery Badge -->
  <g transform="translate(46, 54)">
    <rect width="144" height="56" rx="16" fill="#FF6B35"/>
    <text x="72" y="25" font-family="Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">تحویل همان‌روز تهران</text>
    <text x="72" y="43" font-family="Tahoma, sans-serif" font-size="10" fill="#FFF7ED" text-anchor="middle">موجودی فوری بیش از ۲۰۰ مدل</text>
  </g>
</svg>
