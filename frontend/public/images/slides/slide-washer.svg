<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" width="600" height="440" fill="none">
  <defs>
    <linearGradient id="bgWash" x1="0" y1="0" x2="600" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B8478"/>
      <stop offset="50%" stop-color="#0F2A43"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="washerBody" x1="175" y1="50" x2="425" y2="385" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="65%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <radialGradient id="drumGlass" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.55"/>
      <stop offset="65%" stop-color="#0F172A" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </radialGradient>
  </defs>

  <rect width="600" height="440" rx="32" fill="url(#bgWash)"/>
  <circle cx="130" cy="100" r="120" fill="#3FCFC0" fill-opacity="0.14"/>
  <circle cx="480" cy="340" r="140" fill="#38BDF8" fill-opacity="0.1"/>

  <ellipse cx="300" cy="396" rx="145" ry="15" fill="#04101C" fill-opacity="0.45"/>

  <!-- Washing Machine Body -->
  <rect x="180" y="52" width="240" height="336" rx="26" fill="url(#washerBody)" stroke="#E2E8F0" stroke-width="2"/>

  <!-- Top Control Panel -->
  <rect x="180" y="52" width="240" height="68" rx="24" fill="#F8FAFC"/>
  <line x1="182" y1="120" x2="418" y2="120" stroke="#CBD5E1" stroke-width="2"/>
  <!-- Drawer -->
  <rect x="198" y="70" width="64" height="32" rx="6" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1"/>
  <!-- Rotary Dial -->
  <circle cx="300" cy="86" r="18" fill="#0F2A43" stroke="#12B5A5" stroke-width="3"/>
  <circle cx="300" cy="86" r="6" fill="#3FCFC0"/>
  <!-- Digital LED Display -->
  <rect x="336" y="70" width="68" height="32" rx="8" fill="#0F172A"/>
  <text x="370" y="91" font-family="monospace" font-size="14" font-weight="bold" fill="#3FCFC0" text-anchor="middle">0:45</text>

  <!-- Front Drum Door -->
  <circle cx="300" cy="246" r="92" fill="#1E293B" stroke="#94A3B8" stroke-width="8"/>
  <circle cx="300" cy="246" r="74" fill="url(#drumGlass)" stroke="#38BDF8" stroke-width="2" stroke-opacity="0.5"/>
  <!-- Water Wave Effect inside Drum -->
  <path d="M232 252 Q265 230 300 252 T368 252 A68 68 0 0 1 232 252 Z" fill="#12B5A5" fill-opacity="0.45"/>
  <circle cx="275" cy="220" r="8" fill="#FFFFFF" fill-opacity="0.35"/>
  <circle cx="325" cy="210" r="5" fill="#FFFFFF" fill-opacity="0.45"/>
  <circle cx="315" cy="268" r="6" fill="#FFFFFF" fill-opacity="0.3"/>

  <!-- Floating Badges -->
  <g transform="translate(42, 92)">
    <rect width="122" height="54" rx="14" fill="#FFFFFF" fill-opacity="0.95"/>
    <text x="61" y="24" font-family="Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#0F2A43" text-anchor="middle">موتور Direct Drive</text>
    <text x="61" y="42" font-family="Tahoma, sans-serif" font-size="10" fill="#0B8478" text-anchor="middle">فوق‌العاده کم‌صدا و بدون لرزش</text>
  </g>

  <g transform="translate(436, 268)">
    <rect width="124" height="54" rx="14" fill="#12B5A5"/>
    <text x="62" y="24" font-family="Tahoma, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">اقساط ۲۴ ماهه</text>
    <text x="62" y="42" font-family="Tahoma, sans-serif" font-size="10" fill="#E6FFFA" text-anchor="middle">بدون نیاز به چک و ضامن</text>
  </g>
</svg>
